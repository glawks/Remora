[package]
name = "remora"
version = "0.2.0"
edition = "2024"
description = "Native Android remote control for a Raspberry Pi"
publish = false

[lib]
name = "remora"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "remora-desktop"
path = "src/main.rs"

[dependencies]
slint = { version = "1.19", features = ["backend-android-activity-06"] }
tokio = { version = "1", features = ["rt", "time", "sync", "net", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.19"

[package.metadata.android]
package = "dev.glawks.remora"
apk_name = "Remora"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Remora"
uses_cleartext_traffic = true

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
orientation = "portrait"
exported = true
window_soft_input_mode = "adjustResize"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "remora"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
