name: Android ARM64 - dev APK

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install Android SDK/NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked

      - name: Build Android ARM64 test APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cargo apk2 build --target aarch64-linux-android --lib

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: remora-arm64-dev
          path: target/debug/apk/*.apk
          if-no-files-found: error
          retention-days: 14
